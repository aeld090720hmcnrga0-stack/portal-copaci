<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Portal COPACI</title>
</head>
<body>
    <h2>Registro de Ciudadano</h2>
    <form id="formRegistro">
        <label>Correo:</label>
        <input type="email" id="correoRegistro" required><br><br>

        <label>Contraseña:</label>
        <input type="password" id="passwordRegistro" required><br><br>

        <button type="submit">Registrarse</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>

    <script>
        document.getElementById("formRegistro").addEventListener("submit", function(event) {
            event.preventDefault();

            let correo = document.getElementById("correoRegistro").value.trim();
            let password = document.getElementById("passwordRegistro").value.trim();

            // Obtener usuarios previos o crear un arreglo vacío
            let usuarios = JSON.parse(localStorage.getItem("usuariosRegistrados")) || [];

            // Validar si el correo ya existe
            let existe = usuarios.some(u => u.email === correo);
            if (existe) {
                alert("Este correo ya está registrado.");
                return;
            }

            // Guardar nuevo usuario
            usuarios.push({ email: correo, pass: password });
            localStorage.setItem("usuariosRegistrados", JSON.stringify(usuarios));

            alert("¡Registro exitoso! Ahora puedes iniciar sesión.");
            window.location.href = "index.html"; // Te manda al login
        });
    </script>
</body>
</html>
